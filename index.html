<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>VOCABUKI EVENT CALENDAR</title>
  <link rel="icon" href="fabicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=RocknRoll+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { margin:0; padding:0; background:#FFFBEC; overflow-x:hidden; width:100%; }
    body { margin:0; padding:0; font-family:"M PLUS Rounded 1c",system-ui; background:#FFFBEC; background-image:radial-gradient(circle at 3px 3px,rgba(46,197,206,0.14) 1.8px,transparent 2px); background-size:8px 8px; background-attachment:fixed; min-height:100dvh; display:flex; justify-content:center; align-items:flex-start; overflow-x:hidden; }
    #app-shell { width:100%; max-width:480px; min-height:100dvh; position:relative; background:transparent; }
    #app { width:100%; position:relative; min-height:100%; }
    button { font-family:inherit; cursor:pointer; }
    input, textarea, select { font-family:inherit; }
    #app-shell::-webkit-scrollbar { width:0; }
    @keyframes vbBounce { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-14px) scale(1.15)} }
    @keyframes vbFadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .vb-loading-dot { animation: vbBounce 0.7s ease-in-out infinite; }
    .vb-loading-dot:nth-child(2) { animation-delay: 0.12s; }
    .vb-loading-dot:nth-child(3) { animation-delay: 0.24s; }
    .vb-detail-enter { animation: vbFadeIn 0.22s ease-out both; }
    .vb-card { transition: transform 0.08s, box-shadow 0.08s; }
    .vb-card.pressed { transform: translate(3px,3px) !important; box-shadow: 1px 1px 0 #111 !important; }
    @keyframes vbPop { 0%{transform:scale(0.88)} 60%{transform:scale(1.05)} 100%{transform:scale(1)} }
    .fade-in { animation: vbFadeIn 0.3s ease-out both; }
    .pop-in { animation: vbPop 0.35s ease-out both; }
    .quiz-opt { transition: all 0.12s; }
    .quiz-opt:active { transform: translate(2px,2px) !important; box-shadow: 1px 1px 0 #111 !important; }
    @keyframes vbCsToast { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)} 15%{opacity:1;transform:translate(-50%,-50%) scale(1)} 70%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)} }
    .vb-cs-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 60; pointer-events: none; animation: vbCsToast 1.8s ease-out forwards; }
    .vb-fab { position: sticky; bottom: 18px; float: right; right: 16px; margin-right: 16px; z-index: 20; pointer-events: auto; }
    @media (hover: hover) and (pointer: fine) {
      #app-shell::-webkit-scrollbar { width: 4px; }
      #app-shell::-webkit-scrollbar-track { background: transparent; }
      #app-shell::-webkit-scrollbar-thumb { background: rgba(17,17,17,0.2); border-radius: 2px; }
    }
  </style>
</head>
<body>
  <div id="app-shell"><div id="app"></div></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="js/index.js?v=fb1ef0712d"></script>
</body>
</html>
